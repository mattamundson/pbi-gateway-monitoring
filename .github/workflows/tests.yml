name: Tests

on:
  push:
    paths:
      - 'starter/**'
      - 'requirements-dev.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'starter/**'
      - 'requirements-dev.txt'
  workflow_dispatch:

jobs:
  tier1-parser:
    name: Tier 1 parser (Spark-free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate synthetic gateway logs
        run: python starter/tests/generate_synthetic_logs.py

      - name: Run Tier 1 parser test (pure-Python, no Spark)
        run: python starter/tests/test_parser.py

      - name: Run Tier 1 tenant-extract test (mock, no Spark, no network)
        run: python starter/tests/test_tenant_extract.py

      - name: Run Tier 1 tenant preflight test (tenant_doctor)
        run: python starter/tests/test_tenant_doctor.py

      - name: Run Tier 1 cast-quarantine + capacity-bridge test (U14 + M6)
        run: python starter/tests/test_cast_and_bridge.py

  tier2-spark:
    name: Tier 2 medallion (PySpark + JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Spark 3.5 requires JDK 8/11/17 — it FAILS on JDK 21+ with
      # "getSubject is not supported". Pin JDK 17 explicitly.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PySpark + Delta
        run: pip install -r requirements-dev.txt

      - name: Generate synthetic gateway logs
        run: python starter/tests/generate_synthetic_logs.py

      - name: Run Tier 2 Spark parser test
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: python starter/tests/test_parser_spark.py

      - name: Run end-to-end medallion smoke test (bronze->silver->gold)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: python starter/deploy/run_local_smoke.py

      - name: Run Tier 2 tenant-pipeline Spark test (transforms + U15 fan-out guardrail)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: python starter/tests/test_tenant_spark.py

      # Tier 2.5 — runs the notebooks' OWN build_silver_*/build_gold_* transforms
      # against inline bronze in a temp Lakehouse. This is the evidence
      # PAIN-POINT-COVERAGE.md cites for pain points #2 (triage confidence tiers +
      # U15 fan-out closure), #6 (cluster-load CV) and #7 (network correlation
      # dedup) being "local-tested" — but nothing ran it, so a regression in
      # 02_silver_correlate.py / 03_gold_aggregate.py would have shipped green.
      # That is the exact failure mode this suite was written to close.
      - name: Run Tier 2.5 medallion integration test (real build_* transforms)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: python starter/tests/test_medallion_spark.py

      # Tier 3 — the flagship identity-join match-rate simulation. Asserts the
      # simulated RequestId->OperationId match rate stays inside [0.70, 0.95]
      # against the committed sim_out/ fixtures, so a regression in the join or
      # attribution logic is caught structurally before the live-tenant pilot
      # ever measures the real number.
      - name: Run Tier 3 identity-join match-rate simulation
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: python starter/tests/validate_pipeline_sim.py

  collectors-pester:
    name: Collector Pester suite (Windows)
    # The seven collectors run on Windows gateway hosts and had ZERO test
    # coverage AND ZERO CI until now. Run on windows-latest, not ubuntu, because
    # they exercise Windows-only surfaces (Get-PSDrive, Split-Path -Qualifier,
    # the Windows event log, service-account paths) -- testing them on Linux
    # pwsh would prove the wrong thing.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 6
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 6.0.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Install collector module dependencies
        # Get-GatewayInventory.ps1 and Collect-RefreshHistory.ps1 call real
        # DataGateway / MicrosoftPowerBIMgmt cmdlets. Pester can only Mock a
        # command that already resolves (confirmed empirically -- mocking a
        # nonexistent command name throws CommandNotFoundException), so these
        # suites need the real modules installed here even though every call
        # they make is mocked and nothing touches a live tenant.
        shell: pwsh
        run: |
          Install-Module -Name DataGateway -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name MicrosoftPowerBIMgmt -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run collector Pester suites
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'starter/tests/collectors'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'collector-pester.xml'
          $r = Invoke-Pester -Configuration $cfg
          # Fail the job explicitly on any failure rather than relying on the
          # module's exit-code behaviour, which has varied across Pester versions.
          Write-Host "Passed=$($r.PassedCount) Failed=$($r.FailedCount) Skipped=$($r.SkippedCount)"
          if ($r.FailedCount -gt 0) {
            Write-Host "::error::$($r.FailedCount) collector test(s) failed."
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-pester-results
          path: collector-pester.xml

  tenant-harness:
    name: Tenant-extract harness (mock, Spark-free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The tenant-extract pipeline (00 -> 01a -> 04) runs Spark-free in MOCK mode,
      # producing gold_inventory / gold_activities / gold_refreshables / gold_capacities
      # so the Nexus tenant report pages + CU measures have a deterministic feed to
      # bind against without a live tenant. Live runs need an admin-scoped SP.
      - name: Preflight (tenant_doctor, mock) — gates the chain
        env:
          TENANT_DOCTOR_MOCK: '1'
          CAPACITY_BRIDGE_MODE: mock
        run: python starter/notebooks/tenant_doctor.py

      - name: Run full tenant mock chain (00 extract -> 01a silver/gold -> 04 capacity bridge)
        env:
          TENANT_EXTRACT_MOCK: '1'
          FORCE_JSON_LANDING: '1'
          CAPACITY_BRIDGE_MODE: mock
          BRONZE_LANDING_PATH: ${{ runner.temp }}/nexus_lake/bronze
          GOLD_LANDING_PATH: ${{ runner.temp }}/nexus_lake/gold
        run: |
          python starter/notebooks/00_tenant_extract.py
          python starter/notebooks/01a_tenant_silver_gold.py
          python starter/notebooks/04_capacity_bridge.py

      # Execute the Deploy_TenantExtract orchestrator's code cells in MOCK mode so
      # the wired chain (tenant_doctor -> 00 -> 01a -> 04) can't silently break.
      - name: Run Deploy_TenantExtract orchestrator (mock)
        env:
          TENANT_EXTRACT_MOCK: '1'
          TENANT_DOCTOR_MOCK: '1'
          FORCE_JSON_LANDING: '1'
          CAPACITY_BRIDGE_MODE: mock
          BRONZE_LANDING_PATH: ${{ runner.temp }}/nexus_deploy/bronze
          GOLD_LANDING_PATH: ${{ runner.temp }}/nexus_deploy/gold
          NB_DIR: starter/notebooks
          CONFIG_PATH: starter/config/config.sample.json
        run: |
          python - <<'PY'
          import json
          nb = json.load(open("starter/deploy/Deploy_TenantExtract.ipynb"))
          g = {}
          for i, c in enumerate(nb["cells"]):
              if c["cell_type"] == "code":
                  exec(compile("".join(c["source"]), f"cell{i}", "exec"), g)
          assert g["cap_rows"] == 60 and g["gold_counts"]["gold_inventory"] == 4, "deploy chain regression"
          print("Deploy_TenantExtract mock chain OK")
          PY
