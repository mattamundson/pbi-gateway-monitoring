name: Lint PowerShell

on:
  push:
    paths:
      - 'scripts/**.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'scripts/**.ps1'
      - 'PSScriptAnalyzerSettings.psd1'
  workflow_dispatch:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run analyzer
        shell: pwsh
        run: |
          $settings = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings $settings
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
          } else {
            Write-Host "No issues found."
          }
          # Fail the build only on Error-severity findings; warnings are reported but non-blocking.
          $errors = $results | Where-Object Severity -eq 'Error'
          if ($errors) {
            Write-Host "::error::PSScriptAnalyzer found $($errors.Count) error-severity issue(s)."
            exit 1
          }
