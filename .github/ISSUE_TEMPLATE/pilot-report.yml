name: "Pilot report (live-environment validation)"
description: "Ran any part of this kit against a real Fabric tenant + gateway? Report what you saw — especially the identity-join match rate. This is the single most valuable contribution."
title: "[Pilot] <one-line summary of what you validated>"
labels: ["pilot-report", "validation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for piloting! You don't need to run everything — **Task 1 (the identity join) alone is hugely valuable.**
        Fill in only what you tested; leave the rest blank. See `docs/PILOT-GUIDE-START-HERE.md` and
        `research/phase5_validation.md` (the U1–U16 matrix) for context.

  - type: markdown
    attributes:
      value: |
        ## ▶ How to run the FLAGSHIP identity-join match rate (G3) — ~20 min

        This is the single most valuable result. Follow in order; each step says what "good" looks like.

        **Prerequisites (all three, or the match rate is 0 for a boring reason):**
        1. **Paid Fabric capacity, F2 or higher.** Workspace Monitoring's Eventhouse does **not** provision on trial capacity — field-confirmed in `LIVE-TENANT-FINDINGS.md` (2026-07-02). This is the #1 reason a run comes back empty.
        2. A **semantic model that refreshes through your on-prem gateway**, in a workspace you can enable monitoring on.
        3. Access to the **gateway host** file system (for the `RequestId`), which is usually *not* your laptop.

        **Steps:**
        1. **Enable Workspace Monitoring** on the workspace: Workspace settings → Monitoring → **+ Eventhouse**. Wait until the `Monitoring KQL database` shows tables (no `Access error`). If it errors on trial, stop — you need F2+.
        2. **Land the gateway logs** into that same Eventhouse (or reach them via a OneLake shortcut) as `bronze_query_execution` by running `starter/notebooks/01_bronze_ingest.py` (Deploy notebook). It now routes through `gateway_bronze_lib.read_gateway_csv`, so `(ms)`/`(bytes)` headers no longer break ingest (G4 fix).
        3. **Trigger at least one refresh/query** through the gateway, then wait ~10–15 min for the monitoring row to land.
        4. **Confirm rows exist** — run block (1) of `starter/kql/PILOT-identity-join-test.kql`. Empty ⇒ wait longer or check step 1.
        5. **Measure the match rate** — open **`starter/kql/04_identity_match_rate.kql`**. Keep the throttle-safe defaults (`lookback = 15m`; set `workspace_filter` to your one workspace GUID on trial-ish capacity), then run **Block A**. It returns `total_gateway_queries`, `attributed_queries`, and **`match_rate_pct`** — that percentage is the number to report below.
        6. **Split by query type** — run **Block B** (Refresh vs DirectQuery). DirectQuery coverage is the genuinely-open question; report both.
        7. **(If low)** run **Block C** to sample unattributed queries and note the likely cause (wrong workspace, window too narrow, or Dataflow Gen1 / Paginated — confirmed not covered).

        Redact real UPNs / dataset names if you like — we only need the **counts, the match_rate_pct, and which RequestIds matched**, not the values.

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Gateway version, Fabric capacity SKU, gateway mode (standard/VNet), node count.
      placeholder: "e.g. Gateway 3000.x, Fabric F16, standard mode, 3-node cluster"
    validations:
      required: true

  - type: dropdown
    id: identity-join-result
    attributes:
      label: "FLAGSHIP — Identity join (RequestId == OperationId): did it match?"
      description: "The core claim. Did `starter/kql/01_identity_join.kql` return ExecutingUser + ItemName for gateway queries?"
      options:
        - "Matched — returned user + dataset as expected"
        - "Partially matched — some queries attributed, others not"
        - "Did NOT match — join returned nothing / wrong values"
        - "Didn't test this"
    validations:
      required: true

  - type: input
    id: match-rate
    attributes:
      label: "Attribution match rate (U11) — the one number we can't get without you"
      description: "From Block A of `starter/kql/04_identity_match_rate.kql`: paste total_gateway_queries, attributed_queries, and match_rate_pct. Then from Block B, the Refresh vs DirectQuery split."
      placeholder: "e.g. Block A: 120 total / 102 attributed / 85.0%. Block B: Refresh 98%, DirectQuery 0%."
    validations:
      required: false

  - type: input
    id: capacity-sku
    attributes:
      label: "Capacity SKU used for the run (trial vs F2+)"
      description: "Because Workspace Monitoring's Eventhouse fails to provision on trial capacity (LIVE-TENANT-FINDINGS.md 2026-07-02), we track this explicitly. Did monitoring provision cleanly?"
      placeholder: "e.g. F2 pay-as-you-go — Eventhouse provisioned fine; OR trial — Eventhouse failed with KustoWebV2 error"

  - type: dropdown
    id: directquery
    attributes:
      label: "Open question: does the join cover DirectQuery-through-gateway?"
      description: "Chris Webb's post implies yes; the repo scopes it conservatively. Ground truth?"
      options:
        - "Yes — DirectQuery queries were attributed too"
        - "No — DirectQuery queries were NOT attributed"
        - "Didn't test DirectQuery"
    validations:
      required: false

  - type: textarea
    id: evaluation-context
    attributes:
      label: "EvaluationContext encoding (U1/U2)"
      description: "Did the QueryStart `EvaluationContext` start with `{` (direct JSON) or was it base64? Did `artifactId` come through non-null?"
      placeholder: "e.g. direct JSON, artifactId populated for Fabric semantic models"

  - type: textarea
    id: schema-corrections
    attributes:
      label: "Any schema / column-name corrections"
      description: "Did any PowerBIDatasetsWorkspace or gateway-log column name differ from what the KQL/notebooks assume? List them so we can fix the [Unverified] labels."
      placeholder: "e.g. gateway log used `QueryExecutionDuration(ms)` exactly as expected; no changes"

  - type: textarea
    id: notebooks
    attributes:
      label: "Notebooks / collectors run (optional)"
      description: "Did 01→02→03 run end to end in Fabric? Any runtime errors? Did you hit the code-quality items U14–U16 (silent casts, join fan-out, hardcoded service-account paths)?"

  - type: textarea
    id: anything-else
    attributes:
      label: "Anything else"
      description: "Coverage gaps, surprises, cmdlet/API corrections, or a link to a fuller write-up."
